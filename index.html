<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Putar – Poster Lirik</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap">
<style>
:root{color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--c1:#ff7a59;--c2:#3a1c71;--art:none;--ff:'Plus Jakarta Sans',system-ui,sans-serif}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0;height:100%;overflow:hidden;background:#060508;color:#f5f1ea;font-family:var(--ff);-webkit-tap-highlight-color:transparent}
.aura{position:fixed;inset:-20%;z-index:0;background:var(--art) center/cover;filter:blur(90px) saturate(1.4) brightness(.5);animation:drift 24s ease-in-out infinite alternate;transition:background 1s}
.vig{position:fixed;inset:0;z-index:1;background:radial-gradient(120% 80% at 50% 35%,transparent 30%,#060508 95%),linear-gradient(#060508 0,transparent 18%,transparent 70%,#060508 100%);pointer-events:none}
.app{position:relative;z-index:2;height:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;padding:16px 22px 18px;max-width:560px;margin:0 auto}
.top{display:flex;align-items:center;justify-content:flex-end;gap:10px;transition:opacity .4s}
.stage{display:flex;flex-direction:column;align-items:center;text-align:center;margin-top:2px}
.cv{width:min(64vw,32dvh,290px);aspect-ratio:1;border-radius:14px;background:var(--art) center/cover;box-shadow:0 30px 70px rgba(0,0,0,.65),0 0 100px color-mix(in srgb,var(--c1) 38%,transparent),0 0 0 1px rgba(255,255,255,.12);transition:transform .9s cubic-bezier(.25,.8,.25,1)}
.playing .cv{transform:scale(1.04)}
.own{display:grid;gap:8px;margin-top:14px;font-size:.8rem}
.own b{font-size:.9rem}
.own label{display:grid;gap:4px;opacity:.8}
.own input{font:inherit;font-size:.8rem;color:inherit}
.own button{font:inherit;padding:10px;border-radius:10px;border:0;background:#f5f1ea;color:#0b090e;font-weight:600;cursor:pointer}
.th{width:48px;height:48px;border-radius:8px;background:var(--art) center/cover;box-shadow:0 8px 24px rgba(0,0,0,.6),0 0 0 1px rgba(255,255,255,.12);flex:none}
.who{min-width:0;flex:1}
.who b{display:block;font-size:1.3rem;font-weight:800;letter-spacing:-.02em;margin-top:18px;max-width:86vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who span{font-size:.85rem;opacity:.6}
.ib{width:40px;height:40px;border-radius:50%;border:0;background:rgba(255,255,255,.1);color:inherit;display:grid;place-items:center;cursor:pointer;flex:none;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.ib svg{width:18px;height:18px;fill:currentColor}
button:focus-visible,input:focus-visible{outline:2px solid var(--c1);outline-offset:3px}
.lyrics{flex:1;min-height:0;overflow:hidden;position:relative;margin:8px 0;-webkit-mask-image:linear-gradient(transparent,#000 24%,#000 76%,transparent);mask-image:linear-gradient(transparent,#000 24%,#000 76%,transparent)}
.in{transition:transform .7s cubic-bezier(.25,.8,.25,1)}
.in p{margin:0 0 .55em;text-align:center;font-size:clamp(1.4rem,6.4vw,2.1rem);font-weight:800;letter-spacing:-.025em;line-height:1.1;color:rgba(255,255,255,.26);transition:color .5s,transform .5s}
.in p.past{color:rgba(255,255,255,.34)}
.in p.on{background:linear-gradient(90deg,#fff var(--pr,0%),rgba(255,255,255,.3) var(--pr,0%));-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;text-shadow:none;filter:drop-shadow(0 0 18px color-mix(in srgb,var(--c1) 55%,transparent))}
.empty{opacity:.6}
.bot{transition:opacity .4s}
.bar{display:flex;align-items:center;gap:10px;font-size:.75rem;opacity:.75;font-variant-numeric:tabular-nums}
.pg{flex:1;height:3px;background:rgba(255,255,255,.18);border-radius:3px;overflow:hidden}
.pg i{display:block;height:100%;width:0;background:#fff;border-radius:3px}
.btns{display:flex;justify-content:center;align-items:center;gap:22px;margin-top:14px}
.btns .ib{width:48px;height:48px}
.btns .go{width:68px;height:68px;background:#f5f1ea;color:#0b090e}
.btns .go svg{width:26px;height:26px}
.rec .top,.rec .bot{opacity:0;pointer-events:none}
.hint{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 10px);text-align:center;font-size:.72rem;opacity:0;transition:opacity .4s;z-index:3;pointer-events:none}
.rec .hint{animation:hint 3s forwards}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:5;max-width:560px;margin:0 auto;background:rgba(18,15,22,.92);-webkit-backdrop-filter:blur(24px);backdrop-filter:blur(24px);border-radius:22px 22px 0 0;padding:18px 18px calc(env(safe-area-inset-bottom,0px) + 18px);transform:translateY(105%);transition:transform .4s cubic-bezier(.25,.8,.25,1);max-height:78dvh;overflow:auto;box-shadow:0 -1px 0 rgba(255,255,255,.1)}
.sheet.open{transform:none}
.t{display:flex;align-items:center;gap:12px;width:100%;text-align:left;font:inherit;color:inherit;background:none;border:0;border-radius:10px;padding:8px;cursor:pointer}
.t[aria-current=true]{background:rgba(255,255,255,.1)}
.t .th{width:40px;height:40px}
.t small{display:block;opacity:.6}
form{display:flex;gap:8px;margin-top:10px}
form input{flex:1;min-width:0;font:inherit;padding:11px 14px;border-radius:10px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.06);color:inherit}
form button{font:inherit;padding:11px 16px;border-radius:10px;border:0;background:#f5f1ea;color:#0b090e;font-weight:600;cursor:pointer}
#st{font-size:.8rem;opacity:.7;margin:8px 0 0;min-height:1.2em}
@keyframes drift{to{transform:translate(6%,4%) scale(1.15) rotate(6deg)}}
@keyframes hint{0%{opacity:0}15%,70%{opacity:.6}100%{opacity:0}}
@media(prefers-reduced-motion:reduce){.aura{animation:none}.in,.in p,.sheet{transition:none}}
</style>
</head>
<body>
<div class="aura"></div><div class="vig"></div>
<div class="app" id="app">
  <div class="top">
    
    <button class="ib" id="rc" aria-label="Mode rekam: sembunyikan tombol"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="6"/></svg></button>
    <button class="ib" id="mn" aria-label="Daftar lagu dan cari"><svg viewBox="0 0 24 24"><path d="M4 6h16v2H4zM4 11h16v2H4zM4 16h10v2H4z"/></svg></button>
  </div>
  <div class="stage"><div class="cv"></div><div class="who"><b id="ti"></b><span id="ar"></span></div></div>
  <div class="lyrics" id="lyr" aria-live="polite"></div>
  <div class="bot">
    <div class="bar"><span id="cu">0:00</span><div class="pg"><i id="pb"></i></div><span id="du">0:00</span></div>
    <div class="btns">
      <button class="ib" id="pv" aria-label="Lagu sebelumnya"><svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zM9.5 12L18 6v12z"/></svg></button>
      <button class="ib go" id="pl" aria-label="Putar"><svg viewBox="0 0 24 24"><path id="ic" d="M8 5v14l11-7z"/></svg></button>
      <button class="ib" id="nx" aria-label="Lagu berikutnya"><svg viewBox="0 0 24 24"><path d="M16 6h2v12h-2zM6 18V6l8.5 6z"/></svg></button>
    </div>
  </div>
</div>
<div class="hint">Ketuk layar untuk menampilkan tombol</div>
<div class="sheet" id="sh">
  <div id="tl"></div>
  <form id="fm"><input id="q" placeholder="Cari lagu, mis. Judul Artis" aria-label="Cari lagu"><button>Cari</button></form>
  <div class="own"><b>Pakai file sendiri</b><label>Audio (mp3, m4a)<input type="file" id="fa" accept="audio/*"></label><label>Lirik .lrc (opsional)<input type="file" id="fl" accept=".lrc,.txt"></label><label>Cover (opsional)<input type="file" id="fc" accept="image/*"></label><button id="fb" type="button">Tambah ke daftar</button></div>
  <p id="st"></p>
</div>
<script>
const $=s=>document.querySelector(s),app=$('#app');
const T=[
 {title:'Senja di Pelabuhan',artist:'Demo Artis',c:['#ff7a59','#3a1c71'],root:196,bpm:84,pat:[0,null,3,5,7,5,3,null],
  l:['Lampu kapal menyala satu-satu','Angin laut membawa namamu','Aku duduk di ujung dermaga','Menghitung ombak yang pulang','Langit jingga perlahan padam','Tapi hatiku masih terang','Jika malam datang menjemput','Biarkan aku tetap menunggu']},
 {title:'Hujan Pertama',artist:'Demo Artis',c:['#4fd1c5','#1a2a6c'],root:220,bpm:96,pat:[0,2,null,7,5,null,2,3],
  l:['Tetes pertama jatuh di jendela','Kota diam mendengarkan','Payung kecil dan langkah pelan','Kita tertawa tanpa alasan','Biar basah, biar dingin','Asal kau di sebelahku','Hujan, tulislah cerita kita','Di genangan yang bercahaya']},
 {title:'Kota Tanpa Tidur',artist:'Demo Artis',c:['#ffd166','#5b0e2d'],root:174,bpm:108,pat:[0,0,7,null,5,5,3,7],
  l:['Neon berkedip di setiap sudut','Kereta terakhir belum berangkat','Kita berlari melewati lampu merah','Mengejar pagi yang belum tiba','Tak ada yang tidur malam ini','Semua mata masih menyala','Putar lagi lagu yang sama','Sampai matahari ikut bernyanyi']}
];
T.forEach(t=>{t.art=`radial-gradient(circle at 28% 28%,${t.c[0]},transparent 58%),linear-gradient(135deg,${t.c[1]},${t.c[0]})`;
 t.step=60/t.bpm/2;t.n=96;t.dur=t.n*t.step;const L=t.l.length;t.lines=t.l.map((s,i)=>({t:1+i*(t.dur-2)/L,s}))});

let cur,ci=0,playing=false,off=0,ctx,t0=0,idx=-1;const au=new Audio();
const fmt=s=>Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0');
const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const time=()=>playing?(cur.src?au.currentTime:off+ctx.currentTime-t0):off;

function tone(m,f,at,d,type,v){const o=ctx.createOscillator(),g=ctx.createGain();o.type=type;o.frequency.value=f;
 g.gain.setValueAtTime(0,at);g.gain.linearRampToValueAtTime(v,at+.02);g.gain.exponentialRampToValueAtTime(.001,at+d);
 o.connect(g);g.connect(m);o.start(at);o.stop(at+d+.05)}
function schedule(from){
 const now=ctx.currentTime+.05,m=ctx.createGain();m.gain.value=.16;m.connect(ctx.destination);
 for(let i=0;i<cur.n;i++){const tt=i*cur.step;if(tt<from)continue;const at=now+tt-from,p=cur.pat[i%cur.pat.length];
  if(p!==null)tone(m,cur.root*2*2**((p+(Math.floor(i/8)%3==2?12:0))/12),at,cur.step*1.6,'triangle',.6);
  if(i%8===0)tone(m,cur.root/2,at,cur.step*6,'sine',.9)}
}
function engineStart(){
 if(cur.src){if(au.src!==cur.src)au.src=cur.src;au.currentTime=off;au.play().catch(()=>{})}
 else{ctx=new(window.AudioContext||window.webkitAudioContext)();t0=ctx.currentTime;schedule(off)}}
function engineStop(){if(cur.src)au.pause();else if(ctx){ctx.close();ctx=null}}
function play(){if(playing)return;playing=true;engineStart();ui()}
function pause(){if(!playing)return;off=time();engineStop();playing=false;ui()}
function load(i,go){if(playing){engineStop();playing=false}ci=i;cur=T[i];off=0;idx=-1;if(cur.src){au.src=cur.src;au.load()}else au.removeAttribute('src');
 const r=document.documentElement.style;r.setProperty('--c1',cur.c[0]);r.setProperty('--c2',cur.c[1]);r.setProperty('--art',cur.art);
 $('#ti').textContent=cur.title;$('#ar').textContent=cur.artist;$('#du').textContent=fmt(cur.dur);
 $('#lyr').innerHTML=cur.lines.length?'<div class="in">'+cur.lines.map(l=>`<p>${esc(l.s)}</p>`).join('')+'</div>':'<p class="empty">Lirik belum tersedia untuk lagu ini.</p>';
 document.querySelectorAll('.t').forEach((b,k)=>b.setAttribute('aria-current',k===i));
 ui();if(go)play()}
function ui(){app.classList.toggle('playing',playing);$('#ic').setAttribute('d',playing?'M6 5h4v14H6zM14 5h4v14h-4z':'M8 5v14l11-7z');$('#pl').setAttribute('aria-label',playing?'Jeda':'Putar')}
function list(){$('#tl').innerHTML=T.map((t,i)=>`<button class="t" data-i="${i}"><span class="th" style="background:${t.art.replace(/"/g,"'")};background-size:cover"></span><span>${esc(t.title)}<small>${esc(t.artist)}</small></span></button>`).join('');
 document.querySelectorAll('.t').forEach(b=>b.onclick=()=>{load(+b.dataset.i,true);$('#sh').classList.remove('open')})}
function center(){const n=document.querySelector('.in');if(!n||idx<0)return;const p=n.children[idx],h=$('#lyr').clientHeight;
 n.style.transform=`translateY(${h*.5-p.offsetTop-p.offsetHeight/2}px)`}
function tick(){const t=time();$('#cu').textContent=fmt(t);$('#pb').style.width=Math.min(100,t/cur.dur*100)+'%';
 let k=-1;cur.lines.forEach((l,i)=>{if(l.t<=t)k=i});
 const ps=document.querySelector('.in')?.children||[];
 if(k!==idx){idx=k;[...ps].forEach((p,i)=>{p.classList.toggle('on',i===k);p.classList.toggle('past',i<k)});center()}
 if(k>=0){const a=cur.lines[k].t,b=cur.lines[k+1]?cur.lines[k+1].t:cur.dur,pr=Math.max(0,Math.min(1,(t-a)/((b-a)*.8)));ps[k].style.setProperty('--pr',pr*100+'%')}
 if(playing&&t>=cur.dur-.05)load((ci+1)%T.length,true);
 requestAnimationFrame(tick)}

async function lookup(q){
 const r=await fetch('https://itunes.apple.com/search?media=music&entity=song&limit=1&term='+encodeURIComponent(q));
 const s=(await r.json()).results[0];if(!s)throw new Error('none');let lines=[];
 try{const j=await(await fetch(`https://lrclib.net/api/get?artist_name=${encodeURIComponent(s.artistName)}&track_name=${encodeURIComponent(s.trackName)}`)).json();
  lines=(j.syncedLyrics||'').split('\n').map(x=>x.match(/\[(\d+):(\d+(?:\.\d+)?)\]\s*(.*)/)).filter(m=>m&&m[3]).map(m=>({t:+m[1]*60+ +m[2],s:m[3]}))}catch(e){}
 return{title:s.trackName,artist:s.artistName,src:s.previewUrl,dur:30,lines,art:`url(${s.artworkUrl100.replace('100x100','600x600')}) center/cover`,c:['#ff7a59','#2b2236']}}
$('#fm').onsubmit=async e=>{e.preventDefault();const q=$('#q').value.trim();if(!q)return;$('#st').textContent='Mencari…';
 try{const t=await lookup(q);T.push(t);list();load(T.length-1,true);$('#sh').classList.remove('open')}
 catch(err){$('#st').textContent='Pencarian online tidak jalan di halaman preview ini. Buka file HTML dari komputer atau hosting sendiri.'}};

au.addEventListener('loadedmetadata',()=>{if(cur.src&&isFinite(au.duration)){cur.dur=au.duration;$('#du').textContent=fmt(cur.dur)}});
function parseLRC(x){return (x||'').split('\n').map(l=>l.match(/\[(\d+):(\d+(?:\.\d+)?)\]\s*(.*)/)).filter(m=>m&&m[3]).map(m=>({t:+m[1]*60+ +m[2],s:m[3]}))}
$('#fb').onclick=async()=>{const a=$('#fa').files[0];if(!a){$('#st').textContent='Pilih file audio dulu.';return}
 const l=$('#fl').files[0],c=$('#fc').files[0];
 const t={title:a.name.replace(/\.[^.]+$/,''),artist:'Lagu saya',src:URL.createObjectURL(a),dur:300,lines:l?parseLRC(await l.text()):[],art:c?`url(${URL.createObjectURL(c)}) center/cover`:T[0].art,c:T[0].c};
 T.push(t);list();load(T.length-1,false);$('#st').textContent='Ditambahkan. Tekan play.'};
$('#pl').onclick=()=>playing?pause():play();
$('#nx').onclick=()=>load((ci+1)%T.length,playing);
$('#pv').onclick=()=>load((ci+T.length-1)%T.length,playing);
$('#mn').onclick=()=>$('#sh').classList.toggle('open');
$('#rc').onclick=()=>{app.classList.add('rec');$('#sh').classList.remove('open')};
document.addEventListener('click',e=>{if(app.classList.contains('rec')&&!e.target.closest('#rc')){app.classList.remove('rec')}else if(!e.target.closest('#sh,#mn'))$('#sh').classList.remove('open')});
addEventListener('resize',center);
list();load(0,false);tick();
</script>
</body>
</html>
